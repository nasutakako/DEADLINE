<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEADLINE 3D</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07080d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DEADLINE 3D">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
html, body { margin: 0; height: 100%; background: #07080d; overflow: hidden; overscroll-behavior: none; }
#g { position: fixed; left: 0; top: 0; border: 0; display: block; transform-origin: 0 0; background: #07080d; }
#inset { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
</style>
</head>
<body>
<div id="inset"></div>
<iframe id="g" src="game.html?v=8cfb2631e2" title="DEADLINE 3D" allow="fullscreen; autoplay; clipboard-write; clipboard-read; web-share"></iframe>
<script>
window.DEADLINE_SHELL = true;
(() => {
  const g = document.getElementById('g'), inset = document.getElementById('inset');
  const coarse = matchMedia('(pointer: coarse)');
  // the game keeps its own 16px edge, so only the part of an inset beyond that is taken off; held sideways, iPhone
  // reports the same inset on both sides, but only the notch side needs it (the other is a rounded corner)
  const cut = v => Math.max(0, v - 16);
  function fit() {
    const W = innerWidth, H = innerHeight, cs = getComputedStyle(inset);
    const t = parseFloat(cs.paddingTop) || 0, r = parseFloat(cs.paddingRight) || 0, b = parseFloat(cs.paddingBottom) || 0, l = parseFloat(cs.paddingLeft) || 0;
    if (coarse.matches && H > W) {
      // upright phone: the game is laid on its side, its top toward the right edge, its left edge clear of the notch
      const a = cut(t), z = cut(b);
      g.style.width = (H - a - z) + 'px'; g.style.height = W + 'px';
      g.style.transform = 'translate(' + W + 'px,' + a + 'px) rotate(90deg)';
    } else {
      const ang = typeof window.orientation === 'number' ? window.orientation : screen.orientation ? (screen.orientation.angle > 180 ? -90 : screen.orientation.angle) : 0;
      // turned left (90): the notch is on the left; turned right (-90): on the right
      const L = ang === -90 ? 0 : cut(l), R = ang === 90 ? 0 : cut(r), T = cut(t), B = cut(b);
      g.style.width = (W - L - R) + 'px'; g.style.height = (H - T - B) + 'px';
      g.style.transform = 'translate(' + L + 'px,' + T + 'px)';
    }
  }
  addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 120));
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  fit();
  g.addEventListener('load', () => { try { g.contentWindow.focus(); } catch (e) {} });
})();
</script>
</body>
</html>
